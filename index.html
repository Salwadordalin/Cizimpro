<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Antigravity Professional - TouchDesigner Mimic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; color: #fff; }
        #td-footer { position: fixed; bottom: 0; width: 100%; height: 40px; background: #1a1a1a; border-top: 1px solid #333; display: flex; align-items: center; padding: 0 10px; font-size: 10px; color: #666; }
        canvas { display: block; }
        video { display: none; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: cyan; }
    </style>
</head>
<body>
    <div id="loading">SİSTEM BAŞLATILIYOR...</div>
    <div id="ui-layer">
        <div style="position:absolute; top:20px; right:20px; text-align:right;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" width="30" style="filter: brightness(0) invert(1);"><br>
            @WXLL.HX
        </div>
    </div>
    
    <div id="td-footer">
        <span style="color:cyan">FPS: 60.0</span> &nbsp; | &nbsp; TEMPO: 120.0 &nbsp; | &nbsp; TIME: 00:00:01:06 &nbsp; | &nbsp; FRAME: 66
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

    <script>
        // --- AYARLAR ---
        let scene, camera, renderer, composer;
        let particles = [], faceParticles, handParticles;
        let videoElement, hands, faceMesh;
        let handDetections = [], faceDetections = [];

        // --- SHADER (Neon Parlama İçin) ---
        const particleVertexShader = `
            attribute float size;
            attribute vec3 customColor;
            varying vec3 vColor;
            void main() {
                vColor = customColor;
                vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
                gl_PointSize = size * ( 300.0 / -mvPosition.z );
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const particleFragmentShader = `
            uniform vec3 color;
            varying vec3 vColor;
            void main() {
                if ( length( gl_PointCoord - vec2( 0.5, 0.5 ) ) > 0.475 ) discard;
                gl_FragColor = vec4( color * vColor, 1.0 );
            }
        `;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Arka Plan Videosu
            videoElement = document.createElement('video');
            videoElement.setAttribute('autoplay', '');
            videoElement.setAttribute('muted', '');
            videoElement.setAttribute('playsinline', '');
            
            const videoTexture = new THREE.VideoTexture(videoElement);
            scene.background = videoTexture;

            // Parçacık Sistemlerini Oluştur
            faceParticles = createParticleSphere(2000, 0x00ffff);
            handParticles = createParticleSphere(1500, 0xffffff);
            scene.add(faceParticles);
            scene.add(handParticles);

            setupMediapipe();
            animate();
        }

        function createParticleSphere(count, col) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            const color = new THREE.Color(col);

            for (let i = 0; i < count; i++) {
                let r = 0.8;
                let theta = Math.random() * Math.PI * 2;
                let phi = Math.acos(Math.random() * 2 - 1);
                
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 1.5; // Dikey Elips
                positions[i * 3 + 2] = r * Math.cos(phi);

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                sizes[i] = Math.random() * 2 + 1;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: { color: { value: new THREE.Color(0xffffff) } },
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthTest: false
            });

            return new THREE.Points(geometry, material);
        }

        function setupMediapipe() {
            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7 });
            hands.onResults(res => handDetections = res.multiHandLandmarks);

            faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
            faceMesh.setOptions({ refineLandmarks: true, minDetectionConfidence: 0.7 });
            faceMesh.onResults(res => faceDetections = res.multiFaceMeshLandmarks);

            const cameraPipe = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                    await faceMesh.send({ image: videoElement });
                },
                width: 640, height: 480
            });
            cameraPipe.start();
            document.getElementById('loading').style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);

            // Yüz Takibi ve Küresi
            if (faceDetections.length > 0) {
                let nose = faceDetections[0][1];
                faceParticles.position.x = (nose.x - 0.5) * -10;
                faceParticles.position.y = (nose.y - 0.5) * -7;
                faceParticles.rotation.y += 0.01;
                faceParticles.visible = true;
            } else { faceParticles.visible = false; }

            // El Takibi ve İnteraksiyon
            if (handDetections.length > 0) {
                let h1 = handDetections[0];
                let indexTip = h1[8];
                
                handParticles.position.x = (indexTip.x - 0.5) * -10;
                handParticles.position.y = (indexTip.y - 0.5) * -7;
                handParticles.rotation.y += 0.02;
                handParticles.visible = true;

                // İki el arası mesafe ile ölçeklendirme
                if (handDetections.length > 1) {
                    let h2 = handDetections[1];
                    let d = Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y);
                    let s = THREE.MathUtils.mapLinear(d, 0.1, 0.6, 0.5, 3.0);
                    handParticles.scale.set(s, s, s);
                    faceParticles.scale.set(s*0.8, s*0.8, s*0.8);
                }
            } else { handParticles.visible = false; }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
