<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Hologram Experience</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
    </style>
</head>
<body>

<script>
let hands, camera, capture;
let detections = [];
let particles = [];
const NUM_PARTICLES = 80; 
let rotationAngle = 0;

function setup() {
    createCanvas(windowWidth, windowHeight);

    // 1. Kamerayı Başlat (Ön Kamera)
    capture = createCapture({ 
        video: { facingMode: "user" },
        audio: false 
    });
    capture.size(width, height);
    capture.hide();

    // 2. MediaPipe El Takibi
    hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    hands.onResults(results => { detections = results.multiHandLandmarks; });

    camera = new Camera(capture.elt, {
        onFrame: async () => { await hands.send({ image: capture.elt }); },
        width: 640, height: 480
    });
    camera.start();

    // 3. 3D Veri Parçacıkları Oluştur
    for (let i = 0; i < NUM_PARTICLES; i++) {
        let theta = random(TWO_PI);
        let phi = acos(random(-1, 1));
        let r = 110; 

        particles.push({
            x: r * sin(phi) * cos(theta),
            y: r * sin(phi) * sin(theta),
            z: r * cos(phi),
            textVal: random(["0", "1", "X", "Y", "SYS", floor(random(10, 99))])
        });
    }
    textAlign(CENTER, CENTER);
}

function draw() {
    // Videodaki gibi sinematik koyu arka plan
    image(capture, 0, 0, width, height);
    background(0, 210); 

    rotationAngle += 0.015; 

    if (detections && detections.length > 0) {
        
        // Parmak uçlarını takip et
        let p1 = detections[0][8]; // İlk el işaret parmağı
        let cx = p1.x * width;
        let cy = p1.y * height;
        let scaleFactor = 1.0;

        // İki el varsa büyüklüğü ve merkezi güncelle
        if (detections.length > 1) {
            let p2 = detections[1][8];
            let x2 = p2.x * width;
            let y2 = p2.y * height;
            
            cx = (cx + x2) / 2;
            cy = (cy + y2) / 2;
            let d = dist(p1.x * width, p1.y * height, x2, y2);
            scaleFactor = map(d, 50, 600, 0.8, 3.5);

            // Eller arası enerji hattı
            stroke(255, 80);
            strokeWeight(1);
            drawingContext.setLineDash([5, 10]);
            line(p1.x * width, p1.y * height, x2, y2);
            drawingContext.setLineDash([]);
        }

        push();
        translate(cx, cy);
        scale(scaleFactor);

        // Ana Oval Çerçeve
        noFill();
        stroke(255, 120);
        strokeWeight(1);
        ellipse(0, 0, 150, 220);

        let projected = [];
        for (let p of particles) {
            // Y ekseni dönüşü
            let rx = p.x * cos(rotationAngle) - p.z * sin(rotationAngle);
            let rz = p.x * sin(rotationAngle) + p.z * cos(rotationAngle);
            let ry = p.y;
            let alpha = map(rz, -110, 110, 40, 255);
            projected.push({ x: rx, y: ry, z: rz, a: alpha, t: p.textVal });
        }

        // Bağlantı çizgileri (Constellation)
        for (let i = 0; i < projected.length; i++) {
            for (let j = i + 1; j < projected.length; j++) {
                let d = dist(projected[i].x, projected[i].y, projected[j].x, projected[j].y);
                if (d < 50) {
                    stroke(255, projected[i].a / 5);
                    strokeWeight(0.5);
                    line(projected[i].x, projected[i].y, projected[j].x, projected[j].y);
                }
            }
        }

        // Metin ve Noktalar
        for (let p of projected) {
            fill(255, p.a);
            noStroke();
            if (p.z > 20) {
                textSize(9);
                text(p.t, p.x, p.y);
            } else {
                circle(p.x, p.y, 1.5);
            }
        }
        pop();

        // Parmak uçlarına "L" veya Sabit Nokta Efekti
        for (let hand of detections) {
            let idx = hand[8];
            let thm = hand[4];
            fill(255);
            circle(idx.x * width, idx.y * height, 5);
            stroke(255, 150);
            line(idx.x * width, idx.y * height, thm.x * width, thm.y * height);
        }
    }
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
